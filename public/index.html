<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan Review</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Plan Review</div>
    <div class="doc-title" id="doc-title"></div>
    <span class="pill" id="status-pill" data-status="idle">idle</span>
    <button id="end-btn" class="btn danger">End session</button>
  </header>
  <main class="layout">
    <section class="doc-pane">
      <article id="doc" class="doc"></article>
      <div id="working-overlay" class="overlay" hidden>
        <div class="overlay-card">
          <div class="spinner"></div>
          <p>Review submitted — the agent is reworking the plan…</p>
          <p class="overlay-hint">The new version will load here automatically. Chat stays open.</p>
        </div>
      </div>
      <div id="ended-overlay" class="overlay" hidden>
        <div class="overlay-card">
          <p>Session ended</p>
          <p class="overlay-hint">Control has returned to the agent in your terminal. You can close this tab.</p>
        </div>
      </div>
    </section>
    <aside class="sidebar">
      <section class="panel comments-panel">
        <header class="panel-head">
          Comments <span id="comment-count" class="count">0</span>
        </header>
        <div id="comment-list" class="comment-list"></div>
      </section>
      <section class="submit-area">
        <textarea id="overall-note" rows="2" placeholder="Overall note to the agent (optional)…"></textarea>
        <button id="submit-btn" class="btn primary">Submit review</button>
      </section>
      <section class="panel chat-panel">
        <header class="panel-head">Chat</header>
        <div id="chat-list" class="chat-list"></div>
        <form id="chat-form">
          <input id="chat-input" placeholder="Message the agent…" autocomplete="off">
          <button type="submit" class="btn primary">Send</button>
        </form>
      </section>
    </aside>
  </main>

  <div id="comment-fab" hidden>
    <button id="fab-btn">💬 Comment</button>
  </div>

  <div id="composer" hidden>
    <blockquote id="composer-quote"></blockquote>
    <textarea id="composer-text" rows="3" placeholder="Leave a comment…"></textarea>
    <div class="composer-actions">
      <button id="composer-cancel" class="btn">Cancel</button>
      <button id="composer-save" class="btn primary">Comment</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
